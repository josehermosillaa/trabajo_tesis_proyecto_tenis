@if (isAuthenticated()) {

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar px-3 px-xl-4">

    <span class="navbar-brand d-flex align-items-center gap-2 mb-0 h1">
      <span class="brand-accent" aria-hidden="true"></span>
      Sistema de Gestión de Torneos
    </span>

    <button
      type="button"
      class="navbar-toggler"
      aria-controls="mainNavigation"
      aria-label="Mostrar u ocultar navegación"
      [attr.aria-expanded]="navigationOpen"
      (click)="toggleNavigation()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      id="mainNavigation"
      class="collapse navbar-collapse"
      [class.show]="navigationOpen"
    >
      <div class="navbar-nav me-auto">
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" (click)="closeNavigation()">
          Dashboard
        </a>
        <a class="nav-link" routerLink="/competitions" routerLinkActive="active" (click)="closeNavigation()">
          Competencias
        </a>

        @if (isAdministrativeUser()) {
          <a class="nav-link" routerLink="/players" routerLinkActive="active" (click)="closeNavigation()">
            Jugadores
          </a>
        }
        @if (isAdminUser()) {
          <a class="nav-link" routerLink="/registrations" routerLinkActive="active" (click)="closeNavigation()">
            Inscripciones
          </a>
          <a class="nav-link" routerLink="/matches" routerLinkActive="active" (click)="closeNavigation()">
            Partidos
          </a>
          <a class="nav-link" routerLink="/organizers" routerLinkActive="active" (click)="closeNavigation()">
            Organizadores
          </a>
        }
      </div>

      <button
        type="button"
        class="btn btn-outline-light my-2 my-lg-0"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>

  </nav>

}

<main class="app-main">
  <router-outlet></router-outlet>
</main>
